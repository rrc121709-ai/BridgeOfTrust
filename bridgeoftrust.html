<head>
<meta charset="UTF-8">
<title>Bridge of Trust – Social Engineering Defense Simulator</title>
<style>

    }

        display: grid;
        grid-template-columns: 2fr 1.4fr;
        overflow: hidden;
    }
    .left, .right {
        padding: 24px 28px;
    }
    .left {
        border-right: 1px solid #1f2937;
    }
    h1 {
        margin: 0 0 6px 0;
        font-size: 26px;
    }
    .subtitle {
        margin: 0 0 18px 0;
        color: #9ca3af;
        font-size: 14px;
    }
    .stats {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .stat {
        flex: 1;
        min-width: 120px;
        background: #020617;
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid #1f2937;
        font-size: 13px;
    }
    .stat-label {
        color: #9ca3af;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .stat-value {
        font-size: 18px;
        margin-top: 4px;
    }
    .bar {
        height: 8px;
        border-radius: 999px;
        background: #020617;
        overflow: hidden;
        margin-top: 6px;
    }
    .bar-inner {
        height: 100%;
        border-radius: 999px;
        transition: width 0.3s ease;
    }
    .bar-inner.trust {
        background: linear-gradient(90deg, #22c55e, #4ade80);
    }
    .bar-inner.risk {
        background: linear-gradient(90deg, #f97316, #ef4444);
    }
    .scenario-card {
        background: #020617;
        border-radius: 14px;
        border: 1px solid #1f2937;
        padding: 16px 18px;
        margin-top: 10px;
        min-height: 220px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .scenario-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .sender {
        font-weight: 600;
        font-size: 16px;
    }
    .channel {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #0f172a;
        border: 1px solid #1f2937;
        color: #9ca3af;
    }
    .meta {
        font-size: 12px;
        color: #9ca3af;
    }
    .message {
        background: #020617;
        border-radius: 10px;
        border: 1px solid #1f2937;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.5;
    }
    .flags {
        font-size: 12px;
        color: #f97316;
    }
    .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
    }
    .action-btn {
        padding: 10px;
        border-radius: 999px;
        border: none;
        font-size: 13px;
        cursor: pointer;
        background: #111827;
        color: #e5e7eb;
        border: 1px solid #1f2937;
        transition: 0.2s;
    }
    .action-btn:hover {
        background: #1f2937;
    }
    .action-trust { color: #22c55e; }
    .action-verify { color: #eab308; }
    .action-block { color: #f97316; }
    .log {
        font-size: 12px;
        max-height: 260px;
        overflow-y: auto;
        padding-right: 4px;
    }
    .log-entry {
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px dashed #1f2937;
    }
    .log-entry:last-child {
        border-bottom: none;
    }
    .log-label {
        font-weight: 600;
        font-size: 12px;
    }
    .log-text {
        color: #9ca3af;
    }
    .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 10px;
        margin-left: 4px;
    }
    .badge-good {
        background: #064e3b;
        color: #bbf7d0;
    }
    .badge-bad {
        background: #7f1d1d;
        color: #fecaca;
    }

        background: #111827;
        color: #e5e7eb;
    }

        margin-top: 0;
        font-size: 18px;
        margin-bottom: 8px;
    }
    .hint {
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 10px;
    }
    .end-screen {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #020617;
        border: 1px solid #1f2937;
        font-size: 13px;
    }
    .end-title {
        font-weight: 600;
        margin-bottom: 4px;
    }
    .restart-btn {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border-radius: 999px;
        border: none;
        background: #6366f1;
        color: white;
        cursor: pointer;
        font-size: 13px;
    }
    .home-screen {

    }
    .home-title {
        font-size: 26px;
        margin-bottom: 8px;
    }
    .home-sub {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 20px;
    }
    .home-section {
        margin-bottom: 16px;
    }
    .home-label {
        font-size: 13px;
        margin-bottom: 6px;
    }

        background: #020617;
        color: #e5e7eb;

        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #22c55e;
        color: #022c22;
        font-size: 15px;
        cursor: pointer;
    }
    @media (max-width: 900px) {
        .game {
            grid-template-columns: 1fr;
        }
        .left {
            border-right: none;
            border-bottom: 1px solid #1f2937;
        }

</style>
</head>

        flags: ["Asks for password", "Audit context", "Highly suspicious"],
        truth: "attack",
        best: "block",
        explanation: "No legitimate team should ever ask for your password."
    }
];

let currentScenarioIndex = 0;
let trust = 60;
let risk = 20;
let gameOver = false;
let selectedDifficulty = "easy";
let totalRounds = 5;
let scenarioSequence = [];

const leftPane = document.getElementById("leftPane");
const logDiv = document.getElementById("log");
const endScreen = document.getElementById("endScreen");

let trustBar, riskBar, trustScore, riskScore, roundDisplay, scenarioCard;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function showHomeScreen() {
    gameOver = false;
    logDiv.innerHTML = "";
    endScreen.innerHTML = "";
    leftPane.innerHTML = `
        <div class="home-screen">
            <div class="home-title">Bridge of Trust</div>
            <div class="home-sub">
                A social engineering defense simulator. Build (or break) the bridge of trust.
            </div>
            <div class="home-section">
                <div class="home-label">Select difficulty (message complexity)</div>
                <div class="home-options">
                    <button class="home-btn selected" id="diff-easy">Easy</button>
                    <button class="home-btn" id="diff-medium">Medium</button>
                    <button class="home-btn" id="diff-hard">Hard</button>
                </div>
            </div>
            <div class="home-section">
                <div class="home-label">Select number of rounds</div>
                <div class="home-options">
                    <button class="home-btn selected" id="round-5">5</button>
                    <button class="home-btn" id="round-10">10</button>
                    <button class="home-btn" id="round-20">20</button>
                </div>
            </div>
            <button class="home-start" onclick="startGame()">Start Simulation</button>
        </div>
    `;
    document.getElementById("diff-easy").onclick = () => setDifficulty("easy");
    document.getElementById("diff-medium").onclick = () => setDifficulty("medium");
    document.getElementById("diff-hard").onclick = () => setDifficulty("hard");
    document.getElementById("round-5").onclick = () => setRounds(5);
    document.getElementById("round-10").onclick = () => setRounds(10);
    document.getElementById("round-20").onclick = () => setRounds(20);
}

function setDifficulty(diff) {
    selectedDifficulty = diff;
    ["diff-easy", "diff-medium", "diff-hard"].forEach(id => {
        document.getElementById(id).classList.remove("selected");
    });
    document.getElementById("diff-" + diff).classList.add("selected");
}

function setRounds(n) {
    totalRounds = n;
    ["round-5", "round-10", "round-20"].forEach(id => {
        document.getElementById(id).classList.remove("selected");
    });
    document.getElementById("round-" + n).classList.add("selected");
}

function startGame() {
    trust = 60;
    risk = 20;
    gameOver = false;
    currentScenarioIndex = 0;
    logDiv.innerHTML = "";
    endScreen.innerHTML = "";

    leftPane.innerHTML = `
        <h1>Bridge of Trust</h1>
        <div class="subtitle">
            Difficulty: ${selectedDifficulty.toUpperCase()} · Rounds: ${totalRounds}
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="roundDisplay">1 / ${totalRounds}</div>
            </div>
            <div class="stat">
                <div class="stat-label">Trust Bridge</div>
                <div class="bar">
                    <div class="bar-inner trust" id="trustBar" style="width:60%"></div>
                </div>
                <div class="stat-value" id="trustScore">60</div>
            </div>
            <div class="stat">
                <div class="stat-label">Risk Level</div>
                <div class="bar">
                    <div class="bar-inner risk" id="riskBar" style="width:20%"></div>
                </div>
                <div class="stat-value" id="riskScore">20</div>
            </div>
        </div>
        <div class="scenario-card" id="scenarioCard"></div>
    `;

    trustBar = document.getElementById("trustBar");
    riskBar = document.getElementById("riskBar");
    trustScore = document.getElementById("trustScore");
    riskScore = document.getElementById("riskScore");
    roundDisplay = document.getElementById("roundDisplay");
    scenarioCard = document.getElementById("scenarioCard");

    buildScenarioSequence();
    updateBars();
    renderScenario();
}

function getPoolForDifficulty() {
    if (selectedDifficulty === "easy") {
        // 15 easy + 5 medium = 20 unique
        return easyScenarios.concat(mediumScenarios.slice(0, 5));
    }
    if (selectedDifficulty === "medium") {
        // 15 medium + 5 easy = 20 unique
        return mediumScenarios.concat(easyScenarios.slice(0, 5));
    }
    // hard: 15 hard + 5 medium = 20 unique
    return hardScenarios.concat(mediumScenarios.slice(5, 10));
}

function buildScenarioSequence() {
    const pool = getPoolForDifficulty();
    const shuffled = shuffle([...pool]);
    scenarioSequence = shuffled.slice(0, totalRounds);
}

function renderScenario() {
    if (currentScenarioIndex >= totalRounds) {
        endGame();
        return;
    }
    const s = scenarioSequence[currentScenarioIndex];
    roundDisplay.textContent = `${currentScenarioIndex + 1} / ${totalRounds}`;
    scenarioCard.innerHTML = `
        <div class="scenario-header">
            <div>
                <div class="sender">${s.sender}</div>
                <div class="meta">${s.dept} · ${s.channel}</div>
            </div>
            <div class="channel">${s.channel}</div>
        </div>
        <div class="message">${s.message}</div>
        <div class="flags"><strong>Signals:</strong> ${s.flags.join(" · ")}</div>
        <div class="actions">
            <button class="action-btn action-trust" onclick="handleAction('trust')">Trust / Approve</button>
            <button class="action-btn action-verify" onclick="handleAction('verify')">Verify via Trusted Channel</button>
            <button class="action-btn action-block" onclick="handleAction('block')">Block / Report</button>
        </div>
    `;
}

function logEntry(action, outcome, explanation) {
    const div = document.createElement("div");
    div.className = "log-entry";
    let badgeClass = "badge-neutral";
    if (outcome === "good") badgeClass = "badge-good";
    if (outcome === "bad") badgeClass = "badge-bad";
    div.innerHTML = `
        <div class="log-label">
            Round ${currentScenarioIndex + 1} – You chose: ${action}
            <span class="badge ${badgeClass}">${outcome.toUpperCase()}</span>
        </div>
        <div class="log-text">${explanation}</div>
    `;
    logDiv.prepend(div);
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function updateBars() {
    trust = clamp(trust, 0, 100);
    risk = clamp(risk, 0, 100);
    trustBar.style.width = trust + "%";
    riskBar.style.width = risk + "%";
    trustScore.textContent = trust;
    riskScore.textContent = risk;
}

function handleAction(action) {
    if (gameOver) return;
    const s = scenarioSequence[currentScenarioIndex];
    let outcome = "neutral";
    let explanation = s.explanation;

    if (action === s.best) {
        outcome = "good";
        trust += 5;
        risk -= 5;
    } else {
        outcome = "bad";
        if (s.truth === "attack") {
            if (action === "trust") {
                risk += 20;
                trust -= 10;
                explanation += " You trusted an attack – the attacker crossed the bridge.";
            } else if (action === "verify") {
                risk += 5;
                explanation += " Verification was okay, but stronger blocking would be safer.";
            } else if (action === "block") {
                risk += 5;
            }
        } else if (s.truth === "legit") {
            if (action === "block") {
                trust -= 15;
                explanation += " You blocked a legitimate request – you damaged the trust bridge.";
            } else if (action === "verify") {
                trust -= 2;
                explanation += " Over-verification slowed things down but was still safe.";
            } else if (action === "trust") {
                trust += 2;
            }
        } else if (s.truth === "legit_maybe") {
            if (action === "trust") {
                risk += 10;
                explanation += " This could have been spoofed – trusting without verification is risky.";
            } else if (action === "block") {
                trust -= 10;
                explanation += " You blocked something that might have been real – friction added.";
            }
        }
    }

    updateBars();
    logEntry(action, outcome, explanation);

    currentScenarioIndex++;
    if (risk >= 100 || trust <= 0 || currentScenarioIndex >= totalRounds) {
        endGame();
    } else {
        renderScenario();
    }
}

function endGame() {
    gameOver = true;
    scenarioCard.innerHTML = "<h2>Simulation complete.</h2><p>Check the incident log to review your decisions.</p>";

    let verdict = "";
    if (risk >= 100) {
        verdict = "Your risk level maxed out. Multiple attacks crossed the bridge and caused serious incidents.";
    } else if (trust <= 0) {
        verdict = "Your trust bridge collapsed. You blocked or over-scrutinized too many legitimate requests.";
    } else if (risk < 40 && trust > 60) {
        verdict = "Excellent balance. You kept attackers out while maintaining strong internal trust.";
    } else {
        verdict = "Mixed performance. You handled some situations well, but there’s room to improve your balance.";
    }

    const finalScore = Math.max(0, Math.round(trust * 2 - risk));

    endScreen.innerHTML = `
        <div class="end-screen">
            <div class="end-title">Final Assessment</div>
            <div>${verdict}</div>
            <div style="margin-top:8px;">Final Trust: ${trust} · Final Risk: ${risk}</div>
            <div style="margin-top:4px;"><strong>Final Score:</strong> ${finalScore}</div>
            <button class="restart-btn" onclick="showHomeScreen()">Back to Home</button>
        </div>
    `;
}

showHomeScreen();
</script>

</body>
</html>
